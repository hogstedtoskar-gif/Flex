<!DOCTYPE html>
<!-- lang="en-GB" keeps <input type="date"> in ISO-ish dd/mm/yyyy; the time
     inputs are custom (class="time24") so they're 24h on every OS. -->
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#4f8cff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Time Tracker" />
  <title>Time Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Time Tracker</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="diary">Diary</button>
      <button class="tab" data-view="summary">Summary</button>
      <button class="tab" data-view="quick">Quick</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
    <div class="topbar-right">
      <span class="clock" id="live-clock"></span>
      <div class="user-badge" id="user-badge" hidden>
        <span class="user-name" id="user-name"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" title="Log out">Log out</button>
      </div>
    </div>
  </header>

  <main id="view-root" class="view-root"></main>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- View templates -->
  <template id="tpl-login">
    <section class="view view-login">
      <div class="card login-card">
        <div class="card-header"><h2>Sign in</h2></div>
        <form class="form-grid login-form" data-login-form autocomplete="on">
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" autocapitalize="off"
                   autocorrect="off" spellcheck="false" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <div class="login-error" data-login-error></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Sign in</button>
          </div>
          <p class="muted small" data-register-hint hidden>
            No account? <a href="#" data-action="show-register">Create one</a>.
          </p>
        </form>
      </div>
    </section>
  </template>

  <template id="tpl-register">
    <section class="view view-login">
      <div class="card login-card">
        <div class="card-header"><h2>Create account</h2></div>
        <form class="form-grid login-form" data-register-form autocomplete="on">
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" autocapitalize="off"
                   autocorrect="off" spellcheck="false" required />
          </label>
          <label>
            <span>Password <em class="muted small">(min 6 chars)</em></span>
            <input type="password" name="password" autocomplete="new-password" minlength="6" required />
          </label>
          <label>
            <span>Confirm password</span>
            <input type="password" name="confirm" autocomplete="new-password" minlength="6" required />
          </label>
          <div class="login-error" data-register-error></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create account</button>
          </div>
          <p class="muted small">
            <a href="#" data-action="show-login">Back to sign in</a>
          </p>
        </form>
      </div>
    </section>
  </template>

  <template id="tpl-dashboard">
    <section class="view view-dashboard">
      <div class="grid-2">
        <div class="card card-actions">
          <div class="card-header">
            <h2>Today</h2>
            <span class="today-date" data-today-date></span>
          </div>
          <div class="status-row" data-status></div>
          <div class="project-picker" data-project-picker hidden>
            <label>
              <span>Project</span>
              <select data-dashboard-project></select>
            </label>
            <span class="muted small" data-project-picker-hint></span>
          </div>
          <div class="actions">
            <button class="btn btn-primary btn-lg" data-action="clock-in">Clock in</button>
            <button class="btn btn-warning btn-lg" data-action="lunch-start">Start lunch</button>
            <button class="btn btn-warning btn-lg" data-action="lunch-end">End lunch</button>
            <button class="btn btn-danger btn-lg" data-action="clock-out">Clock out</button>
          </div>
          <div class="today-timeline" data-today-timeline></div>
          <div class="today-totals" data-today-totals></div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>This week</h2>
            <span class="muted" data-week-range></span>
          </div>
          <div class="week-totals" data-week-totals></div>
          <div class="progress-group" data-week-progress></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Manual entry</h2>
          <span class="muted">enter times for any day</span>
        </div>
        <form class="manual-form" data-manual-form>
          <label>
            <span>Date</span>
            <input type="date" name="date" required />
          </label>
          <label>
            <span>Clock in</span>
            <input type="text" class="time24" name="clockIn" placeholder="HH:MM" required />
          </label>
          <label>
            <span>Clock out</span>
            <input type="text" class="time24" name="clockOut" placeholder="HH:MM" required />
          </label>
          <label>
            <span>Lunch start <em class="muted small">(optional)</em></span>
            <input type="text" class="time24" name="lunchStart" placeholder="HH:MM" />
          </label>
          <label>
            <span>Lunch end <em class="muted small">(optional)</em></span>
            <input type="text" class="time24" name="lunchEnd" placeholder="HH:MM" />
          </label>
          <label class="manual-mode">
            <span>On existing entries</span>
            <select name="mode">
              <option value="replace">Replace day</option>
              <option value="append">Append to day</option>
            </select>
          </label>
          <label data-manual-project-label hidden>
            <span>Project <em class="muted small">(optional)</em></span>
            <select name="projectId" data-manual-project></select>
          </label>
          <label>
            <span>Tags <em class="muted small">(optional, comma-separated)</em></span>
            <input type="text" name="tags" maxlength="200" placeholder="deep-work, review" />
          </label>
          <div class="manual-actions">
            <button type="submit" class="btn btn-primary">Save entry</button>
            <button type="reset" class="btn btn-ghost">Clear</button>
          </div>
        </form>
        <div class="manual-error" data-manual-error></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header">
            <h2>Overtime period</h2>
            <span class="muted" data-period-range></span>
          </div>
          <div class="period-summary" data-period-summary></div>
          <div class="period-weeks" data-period-weeks></div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Flex balance</h2>
            <span class="muted">all-time</span>
          </div>
          <div class="flex-display" data-flex-display></div>
          <div class="alerts" data-alerts></div>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-diary">
    <section class="view view-diary">
      <div class="card">
        <div class="card-header">
          <h2>Diary</h2>
          <div class="diary-controls">
            <button class="btn btn-ghost" data-action="prev-day" title="Previous day">&larr;</button>
            <input type="date" data-diary-date />
            <button class="btn btn-ghost" data-action="next-day" title="Next day">&rarr;</button>
            <button class="btn btn-ghost" data-action="today-day">Today</button>
          </div>
        </div>
        <div class="diary-day-summary" data-diary-summary></div>
        <div class="diary-timeline" data-diary-timeline></div>
        <div class="diary-validation" data-diary-validation></div>
        <div class="diary-entries" data-diary-entries></div>
        <div class="diary-add">
          <button class="btn btn-primary" data-action="add-entry">+ Add segment</button>
        </div>
        <div class="note-block">
          <label for="diary-note">Note</label>
          <textarea id="diary-note" data-diary-note placeholder="Notes for this day..."></textarea>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-summary">
    <section class="view view-summary">
      <div class="card">
        <div class="card-header">
          <h2>Weekly summary</h2>
          <div class="diary-controls">
            <button class="btn btn-ghost" data-action="prev-week">&larr;</button>
            <input type="week" data-week-picker />
            <button class="btn btn-ghost" data-action="next-week">&rarr;</button>
          </div>
        </div>
        <div data-week-table></div>
        <div class="project-breakdown-wrap" data-week-projects></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Monthly breakdown</h2>
          <div class="diary-controls">
            <button class="btn btn-ghost" data-action="prev-month">&larr;</button>
            <input type="month" data-month-picker />
            <button class="btn btn-ghost" data-action="next-month">&rarr;</button>
          </div>
        </div>
        <div data-month-table></div>
        <div data-month-chart class="chart-block"></div>
        <div class="project-breakdown-wrap" data-month-projects></div>
      </div>
    </section>
  </template>

  <template id="tpl-quick">
    <section class="view view-quick">
      <div class="quick-card">
        <div class="quick-status" data-quick-status>
          <div class="quick-status-dot"></div>
          <div class="quick-status-text">Loading…</div>
          <div class="quick-status-sub muted"></div>
        </div>

        <div class="quick-totals" data-quick-totals></div>

        <div class="quick-buttons">
          <button class="quick-btn quick-btn-in" data-quick-action="clock-in">
            <span class="quick-btn-label">Clock in</span>
          </button>
          <button class="quick-btn quick-btn-lunch" data-quick-action="lunch-toggle">
            <span class="quick-btn-label" data-quick-lunch-label>Toggle lunch</span>
          </button>
          <button class="quick-btn quick-btn-out" data-quick-action="clock-out">
            <span class="quick-btn-label">Clock out</span>
          </button>
        </div>

        <div class="quick-hint muted small">
          Tip: tap the browser "Add to Home Screen" button to install this as an app icon on your phone.
          For a one-tap home-screen widget, create an API token in <a href="#" data-action="go-settings">Settings → Phone widget</a>.
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-settings">
    <section class="view view-settings">
      <div class="card">
        <div class="card-header"><h2>Settings</h2></div>
        <form class="form-grid" data-settings-form>
          <label>
            <span>Week starts on</span>
            <select name="weekStartDay">
              <option value="1">Monday</option>
              <option value="0">Sunday</option>
              <option value="6">Saturday</option>
            </select>
          </label>
          <label>
            <span>Regular hours per day</span>
            <input type="number" name="regularHoursPerDay" min="0" max="24" step="0.25" />
          </label>
          <fieldset class="work-days-field">
            <legend>Work days <em class="muted small">(hours on unchecked days are overtime-only — never regular, never shortfall)</em></legend>
            <div class="work-days-row" data-work-days>
              <label><input type="checkbox" data-work-day="1" /> Mon</label>
              <label><input type="checkbox" data-work-day="2" /> Tue</label>
              <label><input type="checkbox" data-work-day="3" /> Wed</label>
              <label><input type="checkbox" data-work-day="4" /> Thu</label>
              <label><input type="checkbox" data-work-day="5" /> Fri</label>
              <label><input type="checkbox" data-work-day="6" /> Sat</label>
              <label><input type="checkbox" data-work-day="0" /> Sun</label>
            </div>
          </fieldset>
          <label>
            <span>Office hours start <em class="muted small">(HH:MM, blank = no limit)</em></span>
            <input type="text" class="time24" name="officeStart" placeholder="07:30" />
          </label>
          <label>
            <span>Office hours end <em class="muted small">(HH:MM, blank = no limit)</em></span>
            <input type="text" class="time24" name="officeEnd" placeholder="17:30" />
          </label>
          <label>
            <span>Weekly overtime target (hours)</span>
            <input type="number" name="weeklyOvertimeTargetHours" min="0" max="168" step="0.25" />
          </label>
          <fieldset>
            <legend>Per-week overtime targets <em class="muted small">(optional overrides)</em></legend>
            <div class="muted small">
              Leave a week blank to use the default weekly overtime target.
            </div>
            <div data-weekly-targets-list></div>
          </fieldset>
          <label>
            <span>Overtime period start</span>
            <input type="date" name="overtimePeriodStart" />
          </label>
          <label>
            <span>Overtime period length (weeks)</span>
            <input type="number" name="overtimePeriodWeeks" min="0" max="52" step="1" />
          </label>
          <label>
            <span>Default lunch (minutes)</span>
            <input type="number" name="defaultLunchMinutes" min="0" max="240" step="5" />
          </label>
          <label>
            <span>Minimum lunch (minutes) <em class="muted small">(0 = off)</em></span>
            <input type="number" name="minLunchMinutes" min="0" max="240" step="5" />
          </label>
          <label>
            <span>Auto-lunch threshold (hours) <em class="muted small">(deduction applies only when worked exceeds this)</em></span>
            <input type="number" name="lunchThresholdHours" min="0" max="24" step="0.25" />
          </label>
          <label>
            <span>Opening flex balance (hours)</span>
            <input type="number" name="flexOpeningBalance" step="0.25" />
          </label>
          <label>
            <span>Opening flex applies from <em class="muted small">(optional — flex from this date onwards adds on top)</em></span>
            <input type="date" name="flexOpeningDate" />
          </label>
          <label>
            <span>Default project <em class="muted small">(applied to clock-in from widgets / when no project is picked)</em></span>
            <select name="defaultProjectId" data-default-project>
              <option value="">— None (untagged) —</option>
            </select>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save settings</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Projects</h2>
          <span class="muted">tag work segments for reporting</span>
        </div>
        <p class="muted small">
          Optional. Create projects to label your time — then pick one when you clock in,
          or set a default above so iOS widget taps are automatically tagged.
          Segments without a project show up as "Untagged" in summaries.
        </p>
        <form class="projects-create" data-projects-form>
          <label class="projects-name-label">
            <span>Name</span>
            <input type="text" name="name" maxlength="64" placeholder="Project name" required />
          </label>
          <label class="projects-color-label">
            <span>Color <em class="muted small">(optional)</em></span>
            <input type="color" name="color" value="#4f8cff" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add project</button>
          </div>
        </form>
        <div class="projects-list" data-projects-list></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>Data</h2></div>
        <div class="data-actions">
          <button class="btn" data-action="export-json">Export JSON backup</button>
          <button class="btn" data-action="export-csv">Export CSV (daily)</button>
          <button class="btn" data-action="export-segments-csv">Export CSV (segments)</button>
          <label class="btn btn-ghost file-label">
            Import JSON
            <input type="file" accept="application/json" data-import-file hidden />
          </label>
        </div>
        <p class="muted small">Import replaces all current data after confirmation.</p>
      </div>

      <div class="card">
        <div class="card-header"><h2>Account</h2></div>
        <form class="form-grid account-form" data-password-form>
          <label>
            <span>Current password</span>
            <input type="password" name="currentPassword" autocomplete="current-password" required />
          </label>
          <label>
            <span>New password <em class="muted small">(min 6 chars)</em></span>
            <input type="password" name="newPassword" autocomplete="new-password" minlength="6" required />
          </label>
          <label>
            <span>Confirm new password</span>
            <input type="password" name="confirm" autocomplete="new-password" minlength="6" required />
          </label>
          <div class="login-error" data-password-error></div>
          <div class="form-actions">
            <button type="submit" class="btn">Change password</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Phone widget</h2>
          <span class="muted">API tokens for Shortcuts / HTTP-Shortcut apps</span>
        </div>
        <p class="muted small">
          Create a long-lived token and paste it into your phone's Shortcuts app
          to get a one-tap home-screen widget that clocks you in or out.
          Tokens give widget access only — they can't log in to this page or
          change your password.
        </p>

        <form class="tokens-create" data-tokens-form>
          <label>
            <span>Label <em class="muted small">(e.g. "iPhone home", "Work Android")</em></span>
            <input type="text" name="label" maxlength="64" placeholder="iPhone home" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create token</button>
          </div>
        </form>

        <div class="tokens-reveal" data-tokens-reveal hidden>
          <p class="muted small"><strong>Copy this token now — it will not be shown again.</strong></p>
          <div class="tokens-reveal-row">
            <code class="tokens-reveal-value" data-tokens-reveal-value></code>
            <button type="button" class="btn" data-action="copy-token">Copy</button>
          </div>
          <details class="tokens-setup">
            <summary>iOS Shortcuts setup</summary>
            <ol class="muted small">
              <li>Open the <b>Shortcuts</b> app → <b>+</b> (new shortcut).</li>
              <li>Add action <b>"Get contents of URL"</b>.</li>
              <li>Tap <b>Show More</b> → Method: <b>POST</b>.</li>
              <li>Headers: add <code>Authorization</code> = <code>Bearer <span data-tokens-reveal-value2></span></code></li>
              <li>URL: <code data-tokens-url>https://.../api/quick/clock-in</code> (use <code>clock-out</code> / <code>lunch-toggle</code> for the others).</li>
              <li>Name it "Clock In", then on iOS 16+ → <b>Add to Home Screen</b>, or use the Shortcuts home-screen widget.</li>
            </ol>
          </details>
          <details class="tokens-setup">
            <summary>Android "HTTP Shortcuts" setup</summary>
            <ol class="muted small">
              <li>Install the free <b>HTTP Shortcuts</b> app (F-Droid / Play Store).</li>
              <li>Create a new shortcut. Method: <b>POST</b>.</li>
              <li>URL: <code data-tokens-url2>https://.../api/quick/clock-in</code></li>
              <li>Headers: <code>Authorization: Bearer <span data-tokens-reveal-value3></span></code></li>
              <li>Save, then long-press the home screen → Widgets → HTTP Shortcuts → pick the shortcut.</li>
            </ol>
          </details>
        </div>

        <div class="tokens-list" data-tokens-list></div>
      </div>

      <div class="card danger-zone">
        <div class="card-header"><h2>Danger zone</h2></div>
        <button class="btn btn-danger" data-action="reset-all">Reset all data</button>
      </div>
    </section>
  </template>

  <script src="js/fsm.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
